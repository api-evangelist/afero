product_versioning:
  scheme: semver-and-release-trains
  note: Afero platform components (Profile Editor, Console, OTA Manager, Developer Hub, firmware, afLib,
    mobile app, hardware) each carry their own R<major>.<minor> release train with dated release notes.
    Afero states it follows Semantic Versioning 2.0.0 for its own software releases.
firmware_versioning:
  note: OTA firmware version numbers are generated by the Afero Platform and are globally unique, partitioned
    by firmware type; they cannot be changed. A human-friendly version string is a separate field on the
    firmware image record. Version numbers are reported through the attribute system at attribute ID =
    firmware type + 2000.
  downgrade_policy: The Afero OTA service does not allow downgrade to a version older than the one installed
    on a device. Re-uploading an older binary creates a new (higher) version number.
  docs: https://afero-docs.readthedocs.io/en/latest/API-OTAEndpoints/
