problems:
- status: 401
  code: unauthorized
  title: Full authentication is required to access this resource
  cause: No Authorization header, an expired access token, or invalid Basic credentials on the token endpoint.
    Afero access tokens expire in roughly four hours.
  remediation: Re-run POST /oauth/token with the partner Client ID and Client Secret and retry with the
    fresh bearer token.
  observed: true
  source_operation: openapi/_original/afero-cloud-api-openapi.yml#createAccessToken
- status: 403
  code: forbidden
  title: Insufficient account or partner privilege
  cause: The authenticated principal lacks the account privilege (canWrite/owner) or partner privilege
    (viewDeviceInfo, manageDeviceProfiles, inviteUsers, owner) required by the operation; those privileges
    are enumerated on GET /v1/users/me.
  remediation: Check accountAccess[].privileges and partnerAccess[].privileges on /v1/users/me and request
    the missing privilege from the partner owner.
  observed: false
  source_operation: openapi/_original/afero-cloud-api-openapi.yml#getCurrentUser
- status: 404
  code: not_found
  title: Resource not found
  cause: Unknown accountId, deviceId, partnerId, deviceTypeId, firmware type or versionNumber.
  remediation: Resolve the identifier from the corresponding list operation before addressing the resource.
  observed: true
  note: 'Confirmed live: an unknown path on api.afero.io returns 404 while gated paths return 401, so
    the API distinguishes the two.'
domain_errors:
  note: Afero publishes a separate result-code registry for the on-device afLib MCU library, which is
    distinct from the Cloud API HTTP errors above.
  docs: https://afero-docs.readthedocs.io/en/latest/afLibErrors/
