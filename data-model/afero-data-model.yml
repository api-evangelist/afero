id_conventions:
- pattern: UUID v4
  applies_to:
  - userId
  - accountId
  - deviceId
  - profileId
  - deviceTypeId
  - partnerId
  - deviceTagId
- pattern: integer-as-string
  applies_to:
  - id (firmware)
  - versionNumber
  - firmwareImageId
  note: May exceed 53-bit precision — parse as BigInteger/BigInt.
- pattern: opaque device id
  applies_to:
  - deviceId
  note: Some deviceIds are 16-character hex strings rather than UUIDs (e.g. 01234462d72ca571 in the Afero
    docs example).
- pattern: attribute id
  applies_to:
  - DeviceAttribute.id
  note: Small integers. 1024+ are device attributes; 2001-2004 and 2101+ report firmware versions (firmware
    type + 2000).
