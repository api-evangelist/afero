method: searched
source: https://afero-docs.readthedocs.io/en/latest/MobileSDK/, https://github.com/aferodeveloper
notes:
- Afero distributes its client SDKs from its own GitHub organisation and a private JFrog Artifactory repository
  rather than from the public language registries — none of the Afero SDKs are published to npm, PyPI,
  Maven Central, NuGet, RubyGems, crates.io or pkg.go.dev (searched 2026-08-02).
- The Swift SDK is consumed as a CocoaPod from Afero's own private podspec repo (git@github.com:aferodeveloper/Podspecs.git),
  not from the CocoaPods trunk. Partners are given read-only GitHub access.
- There is no first-party client library for the Afero Cloud REST API in any server-side language; the
  Java and Swift SDKs are mobile client SDKs.
