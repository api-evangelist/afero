apis:
- aid: afero:authentication-api
  name: Afero Cloud Authentication API
  description: >-
    The OAuth 2.0 token endpoint for the Afero Cloud. A partner authenticates with HTTP Basic using the
    OAuth Client ID and Client Secret issued in the Afero Profile Editor, posts the end-user credentials
    with grant_type=password, and receives a bearer access token (scope "partner account") that expires
    in approximately four hours and is sent on every subsequent Afero Cloud API request.
  humanURL: https://afero-docs.readthedocs.io/en/latest/API-OAuthEndpoints/
  baseURL: https://api.afero.io
  tags:
  - Authentication
  - OAuth
  - Security
  properties:
  - type: OpenAPI
    url: openapi/afero-authentication-api-openapi.yml
  - type: Documentation
    url: https://afero-docs.readthedocs.io/en/latest/API-OAuthEndpoints/
  - type: Overlay
    url: overlays/afero-authentication-api-overlay.yaml
- aid: afero:users-api
  name: Afero Cloud Users API
  description: >-
    The Afero Cloud Users API returns the profile of the authenticated end-user: the Afero accounts the
    user can access and the privileges held on each, the sign-in credential and its verification state,
    any partner accounts and partner privileges (invite users, manage device profiles, view device info),
    and the user, developer and general terms-of-service versions accepted or awaiting acceptance.
  humanURL: https://afero-docs.readthedocs.io/en/latest/API-UserEndpoints/
  baseURL: https://api.afero.io
  tags:
  - Users
  - Accounts
  - Identity
  properties:
  - type: OpenAPI
    url: openapi/afero-users-api-openapi.yml
  - type: Documentation
    url: https://afero-docs.readthedocs.io/en/latest/API-UserEndpoints/
  - type: Overlay
    url: overlays/afero-users-api-overlay.yaml
- aid: afero:devices-api
  name: Afero Cloud Devices API
  description: >-
    The Afero Cloud Devices API lists the devices linked to an Afero account and, via the expansions query
    parameter, returns device state (available, visible, connected, connectable, linked, RSSI, location),
    system and partner device tags, or the raw device attribute values. It also executes asynchronous
    attribute_read and attribute_write actions against a device by attribute ID with hexadecimal little-endian
    payloads, and updates a device friendly name.
  humanURL: https://afero-docs.readthedocs.io/en/latest/API-DeviceEndpoints/
  baseURL: https://api.afero.io
  tags:
  - Devices
  - Device Management
  - Internet of Things
  - Telemetry
  properties:
  - type: OpenAPI
    url: openapi/afero-devices-api-openapi.yml
  - type: Documentation
    url: https://afero-docs.readthedocs.io/en/latest/API-DeviceEndpoints/
  - type: Overlay
    url: overlays/afero-devices-api-overlay.yaml
  - type: AgentSkill
    url: skills/afero-read-device-state.md
  - type: AgentSkill
    url: skills/afero-control-a-device.md
- aid: afero:ota-api
  name: Afero Cloud OTA Firmware API
  description: >-
    The Afero Over-the-Air (OTA) Update API lets a partner drive firmware releases from their own CI/CD
    pipeline instead of the OTA Manager web application. It creates and updates partner firmware types,
    creates firmware records in the partner firmware pool, uploads firmware binaries to a temporary location
    and moves them into the permanent repository, checks whether a name and version already exists, associates
    pool images with device types to make them OTA-eligible, lists and filters firmware images with tag
    filtering and paging, pushes an image to a specific device, dissociates an image from a device type,
    and lists firmware tags.
  humanURL: https://afero-docs.readthedocs.io/en/latest/API-OTAEndpoints/
  baseURL: https://api.afero.io
  tags:
  - Firmware
  - Over-the-Air Updates
  - Device Management
  - Deployment
  properties:
  - type: OpenAPI
    url: openapi/afero-ota-api-openapi.yml
  - type: Documentation
    url: https://afero-docs.readthedocs.io/en/latest/API-OTAEndpoints/
  - type: APIReference
    url: https://afero-docs.readthedocs.io/en/latest/API-OTAEndpoints-Funcs/
  - type: Overlay
    url: overlays/afero-ota-api-overlay.yaml
  - type: AgentSkill
    url: skills/afero-publish-firmware-ota.md
  - type: AgentSkill
    url: skills/afero-audit-firmware-fleet.md
