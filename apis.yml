aid: afero
name: Afero
description: 'Afero, Inc. is a Los Altos, California IoT platform company founded in 2014 by Joe Britt
  and Shin Matsumura. Afero ships an end-to-end connected-product stack: ASR secure radio modules with
  a hardware root of trust and an embedded Hardware Security Module, the afLib MCU libraries and Secure
  Linux Device SDK for firmware, a Bluetooth Low Energy and Wi-Fi onboarding path, the Afero Profile
  Editor low-code device-modeling tool, Java (Android) and Swift (iOS) mobile SDKs with a Softhub, and
  the Afero Cloud — a RESTful API at api.afero.io that lists accounts and devices, reports real-time
  device state, executes attribute read and write actions on connected devices, and drives the over-the-air
  firmware pipeline. Afero has raised $73.2M from investors including Samsung Catalyst Fund and Crosspoint
  Capital Partners and reports millions of deployed devices across 200+ product categories in consumer,
  enterprise and industrial markets.'
